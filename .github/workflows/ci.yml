name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  # Keep the registry index and crate cache warm between jobs.
  CARGO_NET_RETRY: "3"

permissions:
  contents: read

jobs:
  style:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: style
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (including tests, benches and examples)
        run: cargo build --all-targets --all-features

      - name: Tests
        run: cargo test --all-features

      - name: Tests, release profile
        run: cargo test --release --all-features

      # The generated cases are cheap, so one job pays for a deeper sweep than
      # the default 300: an arithmetic or dependency-propagation bug that needs a
      # particular bit pattern is unlikely to show at 300 cases.
      - name: Deeper property sweep
        if: matrix.os == 'ubuntu-latest'
        env:
          PROPTEST_CASES: "2000"
        run: cargo test --release --test properties

      # The four benches are `harness = false` (criterion); compiling them catches
      # a bench that drifted from the library without spending a benchmark run.
      - name: Benches compile
        run: cargo bench --no-run

  msrv:
    name: MSRV (library only, 1.85.0)
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - uses: Swatinem/rust-cache@v2

      # `rust-version` is a promise about a *consumer*'s toolchain, and a consumer
      # resolves only `num-traits`. The dev targets are not part of that promise
      # and cannot be built here at all: `criterion` declares 1.86 and `bevy`
      # declares 1.97.1, and cargo hard-errors on a dependency whose `rust-version`
      # exceeds the active toolchain. So this job checks `--lib` and nothing else;
      # anything that also compiles tests, examples or benches would be red for a
      # reason unrelated to whether the library supports 1.85.
      - name: Library checks out on the advertised rust-version
        run: cargo check --locked --lib --all-features

  docs:
    name: Documentation
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rustdoc, warnings are errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Doctests
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --doc --all-features

  package:
    name: Packaging
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cargo only *warns* about a manifest with no `license` and still exits 0,
      # verified with `cargo package` on a copy with the field deleted, so the
      # metadata and the licence texts are asserted here rather than trusted to
      # the dry run below.
      - name: Licence metadata and texts ship
        run: |
          grep -q '^license = "MIT OR Apache-2.0"' Cargo.toml
          test -f LICENSE-MIT
          test -f LICENSE-APACHE
          cargo package --list | grep -qx 'LICENSE-MIT'
          cargo package --list | grep -qx 'LICENSE-APACHE'

      - name: List the packaged file set
        run: cargo package --list

      # Publishability without uploading: builds the packed tree the way a
      # consumer would get it. It needs the registry index, so it cannot run
      # offline. It does not gate missing metadata — cargo warns about that and
      # succeeds — which is what the step above is for.
      - name: Publish dry run
        run: cargo publish --dry-run
